<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f3f1ed" />
    <title>Pagina nu a fost găsită — Ana Stefanel</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script src="/assets/js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#continut">Sari la conținut</a>

    <header class="site-header">
      <a
        class="brand"
        href="/index.html"
        aria-label="Ana Stefanel — pagina principală"
      >
        Ana Stefanel
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="main-navigation"
        data-menu-toggle
      >
        <span>Meniu</span>
        <span class="menu-toggle-lines" aria-hidden="true"></span>
      </button>

      <nav
        class="main-nav"
        id="main-navigation"
        aria-label="Navigare principală"
        data-menu
      >
        <a href="/index.html">Acasă</a>
        <a class="nav-contact" href="/contact.html">Contact</a>
      </nav>

      <div
        class="menu-backdrop"
        data-menu-backdrop
        aria-hidden="true"
      ></div>
    </header>

    <main class="not-found" id="continut">
      <p class="not-found-code" aria-hidden="true">404</p>

      <article class="not-found-copy" aria-labelledby="not-found-title">
        <p class="eyebrow">Pagina nu a fost găsită</p>
        <h1 id="not-found-title">Se pare că acest link și-a pierdut direcția.</h1>
        <p>
          Pagina pe care o cauți nu există, a fost mutată sau adresa nu este
          corectă. Te poți întoarce la pagina principală ori îmi poți scrie.
        </p>
        <div class="not-found-actions">
          <a class="button button-primary" href="/index.html">
            Înapoi la pagina principală
          </a>
          <a class="text-link" href="/contact.html">Contact</a>
        </div>
      </article>
    </main>
  </body>
</html>
